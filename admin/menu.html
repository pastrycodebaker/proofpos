<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proof POS · Menu editor</title>
<style>
  :root{--bg:#f7f3ec;--panel:#fff;--line:#e4dccf;--ink:#2c2416;--quiet:#7a6a58;--accent:#8b5e3c;--accent-bg:#f4ede4;--warn-bg:#fff4d6;--warn:#7a5a00;--good:#2f7a47;--crit:#b23a2e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button{font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.danger{color:var(--crit)}
  button.link{border:none;background:none;color:var(--accent);padding:4px;text-decoration:underline}
  input,select,textarea{font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
  input[type=checkbox]{width:auto}
  label{display:block;font-size:12px;color:var(--quiet);margin:10px 0 4px}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
  header h1{font-size:17px;margin:0 10px 0 0}
  nav{display:flex;gap:6px}
  nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .who{margin-left:auto;color:var(--quiet);font-size:13px;display:flex;gap:8px;align-items:center}
  .wrap{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px;max-width:1300px;margin:0 auto}
  @media(max-width:860px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .list{max-height:calc(100vh - 170px);overflow:auto;padding:0}
  @media(max-width:860px){.list{max-height:none}}
  .listhead{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px;position:sticky;top:0;background:var(--panel)}
  .row{display:flex;gap:8px;align-items:center}
  .row > *{flex:1}
  .li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .li:hover{background:var(--accent-bg)}
  .li.sel{background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent)}
  .li .n{font-weight:600}
  .li .s{font-size:12px;color:var(--quiet)}
  .cat{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--quiet);padding:10px 12px 4px;background:var(--bg)}
  .pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
  .p-86{background:var(--crit);color:#fff}
  .p-rev{background:var(--warn-bg);color:var(--warn)}
  .banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:14px;display:flex;gap:10px;justify-content:space-between;align-items:center}
  h2{font-size:20px;margin:0}
  h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--quiet);margin:20px 0 6px;border-top:1px solid var(--line);padding-top:14px}
  .toggles{display:flex;flex-wrap:wrap;gap:8px}
  .toggles label{display:flex;gap:6px;align-items:center;margin:0;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink);font-size:14px;cursor:pointer}
  .toggles label.on{background:var(--accent-bg);border-color:var(--accent)}
  table.grid{border-collapse:collapse;width:100%;font-size:14px}
  table.grid th{font-size:12px;color:var(--quiet);font-weight:500;text-align:left;padding:4px}
  table.grid td{padding:4px;vertical-align:top}
  table.grid input{width:84px;padding:6px}
  .cc{font-size:11px;color:var(--quiet);margin-top:2px}
  .scroll{overflow-x:auto}
  .opt{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
  .muted{color:var(--quiet);font-size:13px}
  .bar{display:flex;gap:8px;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
  .status{font-size:13px;color:var(--quiet)}
  .status.ok{color:var(--good)} .status.err{color:var(--crit)}
  .login{max-width:360px;margin:12vh auto}
  .hidden{display:none}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  #sheetPane{padding:12px 16px}
  .sbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .sbar input[type=search],.sbar select{width:auto;min-width:160px}
  .sbar .sp{flex:1}
  .sbar input[type=radio],.sbar input[type=checkbox]{width:auto}
  .sbar .toggles label{white-space:nowrap}
  table.sheet select[data-sf=station]{min-width:120px}
  label.btnlike{font-size:inherit;color:inherit}
  .mass{background:var(--accent-bg);border:1px solid var(--accent);border-radius:10px;padding:8px 10px}
  .mass input,.mass select{width:auto;min-width:120px;padding:5px 8px}
  .mass b{margin-right:4px}
  .sheetwrap{overflow:auto;max-height:calc(100vh - 190px);border:1px solid var(--line);border-radius:10px;background:#fff}
  table.sheet{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
  table.sheet th{position:sticky;top:0;background:#f4efe7;z-index:2;text-align:left;font-weight:600;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.sheet td{padding:2px 4px;border-bottom:1px solid #f0ebe3;vertical-align:middle}
  table.sheet td:nth-child(2),table.sheet th:nth-child(2){position:sticky;left:0;background:inherit;z-index:1}
  table.sheet th:nth-child(2){z-index:3;background:#f4efe7}
  table.sheet tr{background:#fff}
  table.sheet tr.chg{background:#fffaf0}
  table.sheet tr.newrow{background:#eef8f0}
  table.sheet tr.sel{background:var(--accent-bg)}
  table.sheet input,table.sheet select{border:1px solid transparent;border-radius:6px;padding:5px 6px;background:transparent;font-size:13px}
  table.sheet input:hover,table.sheet select:hover{border-color:var(--line)}
  table.sheet input:focus,table.sheet select:focus{border-color:var(--accent);background:#fff;outline:none}
  table.sheet input.dirty{background:#fff1c9}
  table.sheet input[type=number]{width:76px;text-align:right}
  table.sheet input[data-sf=name],table.sheet input[data-mf=name]{min-width:200px}
  table.sheet input[data-sf=category]{min-width:150px}
  table.sheet input:disabled{color:#b9aea0}
  table.sheet .grp{font-weight:600;color:var(--quiet)}
  .countrow{display:grid;grid-template-columns:1fr 70px 120px 36px;gap:6px;margin-bottom:6px}
  #layoutPane{padding:12px 16px}
  .lwrap{display:grid;grid-template-columns:240px 1fr;gap:14px;align-items:start}
  @media(max-width:860px){.lwrap{grid-template-columns:1fr}}
  .lcat{display:flex;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:#fff;cursor:grab;user-select:none;touch-action:none}
  .lcat span:nth-child(2){flex:1;font-weight:600}
  .lcat.sel{background:var(--accent-bg);border-color:var(--accent)}
  .lcols{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:8px}
  .lcol{flex:0 0 250px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
  .lcolh{display:flex;gap:6px;align-items:center;margin-bottom:8px;min-height:34px}
  .lcolh input{font-weight:600;padding:5px 7px}
  .lcolh button{flex:none;padding:5px 9px}
  .lcolh .grip{cursor:grab;touch-action:none}
  .cards{min-height:60px}
  .lcard{border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:6px;background:#fff;cursor:grab;user-select:none;touch-action:none}
  .lcard.off{background:#f5f1ea}
  .lcard.off .lrow{opacity:.55}
  .lmain{min-width:0}
  .lrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .lrow .ln{flex:1;font-weight:600}
  .grip{color:#b9aea0;font-size:16px}
  .lmore{margin-top:8px;cursor:default;touch-action:auto}
  .dragging{opacity:.35}
  label.req{display:flex;gap:5px;align-items:center;margin:0;flex:none;font-size:13px;color:var(--ink);padding:4px 8px;border:1px solid var(--line);border-radius:999px}
  label.req.on{background:var(--accent-bg);border-color:var(--accent)}
  details.more{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:12px 0;background:#fff}
  details.more > summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  details.more > summary::before{content:'▸';color:var(--quiet)}
  details.more[open] > summary::before{content:'▾'}
  details.more[open] > summary{margin-bottom:8px}
  .photorow{display:flex;gap:14px;align-items:center;margin:12px 0}
  .photo{width:120px;height:120px;border-radius:14px;background:#EFE7DA;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
  .photo img{width:100%;height:100%;object-fit:cover}
  label.btn{background:#fff;border:1px solid #E3D9CA;border-radius:10px;padding:8px 14px;font-weight:600}
</style>
</head>
<body>
<div id="loginView" class="login card hidden">
  <h2>Proof POS</h2>
  <p class="muted">Sign in to edit the menu.</p>
  <label>Email</label><input id="email" type="email" autocomplete="username">
  <label>Password</label><input id="password" type="password" autocomplete="current-password">
  <div class="bar"><button class="primary" id="signIn">Sign in</button><span class="status" id="loginStatus"></span></div>
</div>

<div id="appView" class="hidden">
  <header>
    <h1>Menu editor</h1>
    <nav id="tabs">
      <button data-tab="items" class="on">Items</button>
      <button data-tab="sheet">Spreadsheet</button>
      <button data-tab="layout">Layout</button>
      <button data-tab="groups">Modifier groups</button>
      <button data-tab="settings">Settings</button>
    </nav>
    <div class="who"><span id="whoName"></span><button id="signOut">Sign out</button></div>
  </header>
  <div class="wrap" id="wrap">
    <div class="card list" id="listPane"></div>
    <div class="card" id="editPane"></div>
  </div>
  <div id="sheetPane" class="hidden"></div>
  <div id="layoutPane" class="hidden"></div>
</div>

<script type="module">
import { firebaseConfig } from '../firebase-config.js';
import { onlineWhen } from '../shared/online.mjs';

const DEMO = new URLSearchParams(location.search).has('demo');
let authRef = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const money = n => (n === null || n === undefined || n === '' || isNaN(n)) ? '' : '$' + Number(n).toFixed(2);
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'item';
const STATIONS = {espresso:'Espresso bar', kitchen:'Kitchen', none:'Grab and go (runner)'};
const TEMPS = [['hot','Hot'],['iced','Iced'],['','No temp']];

// ---------- Data layer ----------
let store;
async function seedData(){ const r = await fetch('../data/seed-menu.json'); return r.json(); }
function memoryStore(){
  let data = {settings:{sizes:['4 oz','8 oz','12 oz','16 oz','20 oz','Double','Quad'], surchargeRate:0.03, categories:[]}, items:[], groups:[]};
  return {
    async loadAll(){ return structuredClone(data); },
    async saveItem(it){ data.items = data.items.filter(x => x.id !== it.id).concat([structuredClone(it)]); },
    async deleteItem(id){ data.items = data.items.filter(x => x.id !== id); },
    async saveGroup(g){ data.groups = data.groups.filter(x => x.id !== g.id).concat([structuredClone(g)]); },
    async deleteGroup(id){ data.groups = data.groups.filter(x => x.id !== id); },
    async saveSettings(s){ data.settings = structuredClone(s); },
    async getModStock(){ return structuredClone(data.modStock || {}); },
    async setModStock(key, n){ data.modStock = data.modStock || {}; if (n === null) delete data.modStock[key]; else data.modStock[key] = n; },
    async getStaff(){ return structuredClone(data.staff || {members:[], sleepMinutes:5}); },
    async saveStaff(x){ data.staff = structuredClone(x); },
    async getOwners(){ return structuredClone(data.owners || {emails:[]}); },
    async saveOwners(x){ data.owners = structuredClone(x); },
    async loadSeed(seed){ data = {settings:seed.settings, items:seed.items, groups:seed.modifierGroups}; },
    async saveItems(list){ for (const it of list) await this.saveItem(it); },
    async saveGroups(list){ for (const g of list) await this.saveGroup(g); },
  };
}
async function firestoreStore(app){
  const fs = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
  const db = fs.getFirestore(app);
  const root = fs.doc(db, 'menu', 'main');
  const items = fs.collection(db, 'menu', 'main', 'items');
  const groups = fs.collection(db, 'menu', 'main', 'modifierGroups');
  return {
    async loadAll(){
      const [s, i, g] = await Promise.all([fs.getDoc(root), fs.getDocs(items), fs.getDocs(groups)]);
      return {settings: s.exists() ? s.data() : {sizes:['4 oz','8 oz','12 oz','16 oz','20 oz','Double','Quad'], surchargeRate:0.03, categories:[]},
              items: i.docs.map(d => d.data()), groups: g.docs.map(d => d.data())};
    },
    saveItem: it => fs.setDoc(fs.doc(items, it.id), it),
    deleteItem: id => fs.deleteDoc(fs.doc(items, id)),
    saveGroup: g => fs.setDoc(fs.doc(groups, g.id), g),
    deleteGroup: id => fs.deleteDoc(fs.doc(groups, id)),
    saveSettings: s => fs.setDoc(root, s),
    async getModStock(){ const d = await fs.getDoc(fs.doc(db, 'menu', 'modStock')); return d.exists() ? (d.data().counts || {}) : {}; },
    async setModStock(key, n){ await fs.setDoc(fs.doc(db, 'menu', 'modStock'), {counts: {[key]: n === null ? fs.deleteField() : n}}, {merge: true}); },
    async getStaff(){ const d = await fs.getDoc(fs.doc(db, 'settings', 'staff')); return d.exists() ? d.data() : {members:[], sleepMinutes:5}; },
    saveStaff: x => fs.setDoc(fs.doc(db, 'settings', 'staff'), x),
    async getOwners(){ const d = await fs.getDoc(fs.doc(db, 'settings', 'owners')); return d.exists() ? d.data() : {emails:[]}; },
    saveOwners: x => fs.setDoc(fs.doc(db, 'settings', 'owners'), x),
    async saveItems(list){ for (let i = 0; i < list.length; i += 400){ const b = fs.writeBatch(db); list.slice(i, i + 400).forEach(it => b.set(fs.doc(items, it.id), it)); await b.commit(); } },
    async saveGroups(list){ for (let i = 0; i < list.length; i += 400){ const b = fs.writeBatch(db); list.slice(i, i + 400).forEach(g => b.set(fs.doc(groups, g.id), g)); await b.commit(); } },
    async loadSeed(seed){
      let batch = fs.writeBatch(db), n = 0;
      const flush = async () => { await batch.commit(); batch = fs.writeBatch(db); n = 0; };
      batch.set(root, seed.settings); n++;
      for (const it of seed.items){ batch.set(fs.doc(items, it.id), it); if (++n >= 400) await flush(); }
      for (const g of seed.modifierGroups){ batch.set(fs.doc(groups, g.id), g); if (++n >= 400) await flush(); }
      await batch.commit();
    },
  };
}

// ---------- State ----------
let S = {settings:{}, items:[], groups:[]};
let tab = 'items', selId = null, search = '', filter = 'all';
// Columns for "by size and temp" modifier prices, e.g. "hot 16 oz", "iced 20 oz" (Settings → Drink price columns).
const priceColsNow = () => S.settings.priceCols && S.settings.priceCols.length ? S.settings.priceCols : (S.settings.sizes || []);
const colLabel = c => String(c).replace(/^(hot|iced) /, m => m[0].toUpperCase() + m.slice(1));
const surchargeOn = (s, k) => s.surchargeChannels ? !!s.surchargeChannels[k] : k === 'register';
const credit = p => Math.round(p * (1 + (S.settings.surchargeRate || 0)) * 100) / 100;

async function reload(){ S = await store.loadAll(); S.items.sort((a,b) => a.name.localeCompare(b.name)); S.groups.sort((a,b) => a.name.localeCompare(b.name)); render(); }

// ---------- Rendering ----------
function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#wrap').classList.toggle('hidden', tab === 'sheet' || tab === 'layout'); $('#sheetPane').classList.toggle('hidden', tab !== 'sheet'); $('#layoutPane').classList.toggle('hidden', tab !== 'layout');
  if (tab === 'sheet') { renderSheet(); return; }
  if (tab === 'layout') { renderLayout(); return; }
  if (tab === 'items') { renderItemList(); renderItemEditor(); }
  if (tab === 'groups') { renderGroupList(); renderGroupEditor(); }
  if (tab === 'settings') { $('#listPane').innerHTML = `<div class="listhead"><b>Settings</b><div class="muted">Sizes, credit card surcharge, categories and the starter menu.</div></div>`; renderSettings(); }
}
function priceSummary(it){
  const v = (it.versions || []).filter(x => x.price !== null && x.price !== '' && x.price !== undefined);
  if (!v.length) return 'No price';
  if (v.length === 1) return money(v[0].price);
  const ps = v.map(x => Number(x.price)); return `${money(Math.min(...ps))}–${money(Math.max(...ps))} · ${v.length} versions`;
}
function renderItemList(){
  const q = search.toLowerCase();
  // Archived items stay out of the way: only the Archived filter shows them.
  let list = S.items.filter(i => (!q || i.name.toLowerCase().includes(q)) && (filter === 'archived' ? i.archived : !i.archived));
  if (filter === 'review') list = list.filter(i => i.review);
  if (filter === '86') list = list.filter(i => i.eightySixed);
  const cats = [...new Set(list.map(i => i.category || 'Other'))].sort((a,b) => (S.settings.categories || []).indexOf(a) - (S.settings.categories || []).indexOf(b));
  const nRev = S.items.filter(i => i.review && !i.archived).length;
  $('#listPane').innerHTML = `<div class="listhead">
      <div class="row"><input id="search" placeholder="Search items" value="${esc(search)}"><button class="primary" id="newItem" style="flex:none">New item</button></div>
      <div class="row"><select id="filter"><option value="all">All items (${S.items.filter(i => !i.archived).length})</option><option value="review" ${filter==='review'?'selected':''}>Needs review (${nRev})</option><option value="86" ${filter==='86'?'selected':''}>86'd</option><option value="archived" ${filter==='archived'?'selected':''}>Archived (${S.items.filter(i => i.archived).length})</option></select></div>
    </div>` +
    (S.items.length ? '' : `<div style="padding:16px" class="muted">No items yet. Load the starter menu from Settings.</div>`) +
    cats.map(c => `<div class="cat">${esc(c)}</div>` + list.filter(i => (i.category || 'Other') === c).map(i =>
      `<div class="li ${i.id === selId ? 'sel' : ''}" data-id="${esc(i.id)}"><div><div class="n">${esc(i.name)}</div><div class="s">${esc(priceSummary(i))} · ${esc(STATIONS[i.station] || '')}</div></div><div class="chips">${i.eightySixed ? '<span class="pill p-86">86</span>' : ''}${i.review ? '<span class="pill p-rev">Review</span>' : ''}</div></div>`).join('')).join('');
}
function versionMode(it){ return (it.versions || []).some(v => v.size || v.temp) ? 'sizes' : 'single'; }
let pendingImage, pendingFor = null;   // photo picked but not saved yet (null = removed)
function photoBox(it){
  const src = pendingFor === it.id && pendingImage !== undefined ? pendingImage : it.image;
  return `<div class="photo">${src ? `<img src="${esc(src)}" alt="">` : '<span class="muted">No photo</span>'}</div>
    <div><label class="btn" style="display:inline-block;margin:0;cursor:pointer">${src ? 'Change photo' : 'Add a photo'}<input type="file" id="f_photo" accept="image/*" style="display:none"></label>
    ${src ? '<button id="f_photoRm" style="margin-left:6px">Remove</button>' : ''}<div class="muted" id="photoStatus" style="margin-top:6px;font-size:13px">Shows on online ordering and the kiosk. Square-ish photos look best.</div></div>`;
}
// Shrink to at most 1000px on the long side and save as WebP, so photos load fast on phones.
async function shrinkPhoto(file){
  const bmp = await createImageBitmap(file); const k = Math.min(1, 1000 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(res, 'image/webp', 0.82));
}
async function uploadPhoto(blob){
  if (DEMO) return await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); });
  const token = await authRef.currentUser.getIdToken();
  const r = await fetch('/.netlify/functions/images', {method: 'POST', headers: {authorization: 'Bearer ' + token, 'content-type': blob.type}, body: blob});
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'Upload failed'); return d.url;
}
function renderItemEditor(){
  const it = S.items.find(i => i.id === selId); if (pendingFor !== selId){ pendingFor = selId; pendingImage = undefined; }
  if (!it){ $('#editPane').innerHTML = `<p class="muted">Pick an item on the left, or add a new one.</p>`; return; }
  const mode = versionMode(it);
  const single = mode === 'single' ? (it.versions?.[0]?.price ?? '') : '';
  const sizes = S.settings.sizes || [];
  const cell = (t, s) => { const v = (it.versions || []).find(x => x.temp === t && x.size === s); return v ? v.price : ''; };
  const usedTemps = TEMPS.filter(([t]) => (it.versions || []).some(v => v.temp === t));
  $('#editPane').innerHTML = `
    ${it.review ? `<div class="banner"><div><b>Check this item.</b> Price source: ${esc(it.review.source)}.${it.review.note ? ' ' + esc(it.review.note) : ''}</div><label style="margin:0;color:inherit;display:flex;gap:6px;align-items:center;white-space:nowrap"><input type="checkbox" id="f_reviewed"> Reviewed</label></div>` : ''}
    <h2>${esc(it.name)}</h2>

function allItemsNow(){

  const tOrder = {hot:0, iced:1, '':2};
  return [...want].map(k => k.split('|')).sort((a, b) => (tOrder[a[0]] - tOrder[b[0]]) || (sizes.indexOf(a[1]) - sizes.indexOf(b[1])))

  const sel = el.dataset.sf ? `[data-sf="${el.dataset.sf}"]` + (el.dataset.t !== undefined ? `[data-t="${el.dataset.t}"][data-s="${el.dataset.s}"]` : el.dataset.k ? `[data-k="${el.dataset.k}"]` : '') : `[data-mf="${el.dataset.mf}"]` + (el.dataset.s ? `[data-s="${el.dataset.s}"]` : '');
  while (next){ const n = next.querySelector(sel); if (n && !n.disabled){ n.focus(); n.select?.(); return; } next = next.nextElementSibling; }
});
$('#sheetPane').addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  try {
    if (t.dataset.open){ if (sheetDirty()){ sheetMsg('Save or discard changes before opening an item page.', 'err'); return; } tab = 'items'; selId = t.dataset.open; render(); return; }
    if (t.id === 'csvInBtn'){ $('#csvIn').click(); return; }
    if (t.id === 'csvOut'){ exportCsv(); return; }
    if (t.id === 'sheetAdd'){
      const id = uniqueId('new item'); const cat = sheetCat || (S.settings.categories || [])[0] || '';
      draftItems.set(id, {id, name:'New item', description:'', category:cat, station:'none', visible:{register:true, kiosk:true, online:true}, alcohol:false, eightySixed:false, versions:[{temp:'', size:'', price:null}], modifierGroupIds:[], counts:[], review:null, taxable:false});
      sheetQ = ''; sheetMissing = false; renderSheet(); const inp = document.querySelector(`tr[data-sid="${id}"] [data-sf=name]`); inp?.focus(); inp?.select(); return;
    }
    if (t.id === 'sheetDiscard'){ if (t.dataset.armed){ draftItems.clear(); draftGroups.clear(); deletes.clear(); selRows.clear(); renderSheet(); sheetMsg('Changes discarded.'); } else { t.dataset.armed = '1'; t.textContent = 'Tap again to discard'; } return; }
    if (t.id === 'sheetSave'){
      sheetMsg('Saving…');
      const items = [...draftItems.entries()].filter(([id]) => !deletes.has(id)).map(([, it]) => ({...it, name: it.name.trim() || 'Untitled', versions: sortVersions(it.versions)}));
      if (items.length) await store.saveItems(items);
      for (const id of deletes) if (origItem(id)) await store.deleteItem(id);
      if (draftGroups.size) await store.saveGroups([...draftGroups.values()]);
      const n = items.length + deletes.size + draftGroups.size;
      draftItems.clear(); draftGroups.clear(); deletes.clear(); selRows.clear();
      await reload(); sheetMsg(`Saved ${n} change${n === 1 ? '' : 's'}.`, 'ok'); return;
    }
    const m = t.dataset.mass; if (!m) return;
    const ids = [...selRows];
    if (m === 'clear'){ selRows.clear(); renderSheet(); return; }
    if (m === 'cat'){ const c = $('#mCat').value.trim(); if (!c){ sheetMsg('Type a category first.', 'err'); return; } ids.forEach(id => editItem(id, it => { it.category = c; })); }
    if (m === 'addGrp' || m === 'rmGrp'){ const g = $('#mGrp').value; if (!g){ sheetMsg('Pick a modifier group first.', 'err'); return; } ids.forEach(id => editItem(id, it => { const l = (it.modifierGroupIds || []).filter(x => x !== g); it.modifierGroupIds = m === 'addGrp' ? [...l, g] : l; })); }
    if (m === 'price'){
      const raw = $('#mPrice').value.trim().replace('$', ''); const pct = raw.endsWith('%'); const n = parseFloat(raw);
      if (isNaN(n)){ sheetMsg('Enter an amount like +0.25, -0.50 or 5%.', 'err'); return; }
      let missing = 0;
      ids.forEach(id => editItem(id, it => { let any = false; it.versions = (it.versions || []).map(v => { if (v.price === null || v.price === undefined || v.price === '') return v; any = true; return {...v, price: Math.max(0, r2(pct ? v.price * (1 + n / 100) : Number(v.price) + n))}; }); if (!any) missing++; }));
      if (missing) sheetMsg(`${missing} selected item${missing === 1 ? ' has' : 's have'} no price yet, so ${missing === 1 ? 'it was' : 'they were'} skipped.`);
    }
    if (m === 'days'){ const od = openDays(); const days = [...document.querySelectorAll('[data-mday]')].filter(c => c.checked).map(c => Number(c.dataset.mday)); if (!days.length){ sheetMsg('Tick the days first.', 'err'); return; } ids.forEach(id => editItem(id, it => { it.days = od.every(d => days.includes(d)) ? null : days.sort(); })); }
    if (m === 'on' || m === 'off') ids.forEach(id => editItem(id, it => { it.active = m === 'on'; }));
    if (m === 'archive') ids.forEach(id => editItem(id, it => { it.archived = true; }));
    if (m === '86' || m === 'un86') ids.forEach(id => editItem(id, it => { it.eightySixed = m === '86'; }));
    if (m === 'dup'){ const made = []; ids.forEach(id => { const src = itemNow(id); const nid = uniqueId(src.name + ' copy'); draftItems.set(nid, {...structuredClone(src), id: nid, name: src.name + ' copy', review: null, octQtySold: 0, stockCount: null}); made.push(nid); }); selRows.clear(); made.forEach(x => selRows.add(x)); sheetQ = ''; sheetMissing = false; renderSheet(); sheetMsg(`Made ${made.length} cop${made.length === 1 ? 'y' : 'ies'}, selected below. Rename them, then Save.`); return; }
    if (m === 'del'){
      if (!t.dataset.armed){ t.dataset.armed = '1'; t.textContent = `Tap again to delete ${ids.length}`; return; }
      ids.forEach(id => { if (origItem(id)) deletes.add(id); draftItems.delete(id); }); selRows.clear();
    }
    renderSheet(); if (m !== 'price' || !$('#sheetStatus').textContent) sheetMsg(`Updated ${ids.length} item${ids.length === 1 ? '' : 's'}. Save to keep it.`);
  } catch (err){ console.error(err); sheetMsg('Could not save: ' + (err.message || err), 'err'); }
});

// ---------- Layout (sections, order, days, season) ----------
const DAYS = [['Wed',3],['Thu',4],['Fri',5],['Sat',6],['Sun',0],['Mon',1],['Tue',2]];
const openDays = () => S.settings.openDays || [3,4,5,6,0];
function daysLabel(days){
  if (!days || !days.length) return '';
  const od = openDays(); if (od.every(d => days.includes(d))) return '';
  return DAYS.filter(([, n]) => days.includes(n)).map(([l]) => l).join(', ');
}
let layoutCat = '', layoutOpen = null, layoutDirty = false;
let L = null; // working copy: {cats:[], sections:{cat:[...]}, items: Map(id -> {section, sortOrder, days, active})}
function layoutInit(){
  const cats = [...new Set([...(S.settings.categories || []), ...S.items.map(i => i.category).filter(Boolean)])];
  const sections = structuredClone(S.settings.sections || {});
  const items = new Map(S.items.map(i => [i.id, {section: i.section || '', sortOrder: i.sortOrder ?? 999, days: i.days || null, active: i.active !== false}]));
  L = {cats, sections, items}; layoutDirty = false;
}
const layoutItemsIn = (cat, sec) => S.items.filter(i => (i.category || '') === cat && (L.items.get(i.id).section || '') === sec).sort((a, b) => L.items.get(a.id).sortOrder - L.items.get(b.id).sortOrder || a.name.localeCompare(b.name));
function renderLayout(){
  if (!L) layoutInit();
  if (!layoutCat || !L.cats.includes(layoutCat)) layoutCat = L.cats[0] || '';
  const secs = L.sections[layoutCat] || [];
  // items whose section no longer exists fall back to "no section"
  for (const i of S.items) if (i.category === layoutCat){ const x = L.items.get(i.id); if (x.section && !secs.includes(x.section)) x.section = ''; }
  const cols = [...(layoutItemsIn(layoutCat, '').length || !secs.length ? [''] : []), ...secs];
  const card = it => { const x = L.items.get(it.id); const dl = daysLabel(x.days); const open = layoutOpen === it.id;
    return `<div class="lcard ${x.active ? '' : 'off'}" data-lid="${esc(it.id)}"><div class="lrow"><span class="grip" aria-hidden="true">⠿</span><span class="ln">${esc(it.name)}</span>${!x.active ? '<span class="pill p-86">Off season</span>' : ''}${dl ? `<span class="pill p-rev">${esc(dl)}</span>` : ''}</div>
      ${open ? `<div class="lmore"><div class="muted">Days it's offered (all = every day you're open)</div><div class="toggles">${DAYS.filter(([, n]) => openDays().includes(n)).map(([l, n]) => { const on = !x.days || x.days.includes(n); return `<label class="${on ? 'on' : ''}"><input type="checkbox" data-lday="${n}" ${on ? 'checked' : ''}>${l}</label>`; }).join('')}</div>
        <div class="toggles" style="margin-top:6px"><label class="${x.active ? 'on' : ''}"><input type="checkbox" data-lactive ${x.active ? 'checked' : ''}>In season (on the menu)</label></div>
        ${secs.length ? `<div class="row" style="margin-top:6px"><select data-lsec><option value="">No section</option>${secs.map(s => `<option ${s === x.section ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></div>` : ''}</div>` : ''}</div>`; };
  $('#layoutPane').innerHTML = `<div class="sbar"><b>Layout</b><span class="muted">Drag to reorder categories, sections and items. Tap an item for its days and season.</span><span class="sp"></span><span class="status" id="layoutStatus"></span>
      <button id="layoutDiscard" ${layoutDirty ? '' : 'disabled'}>Discard</button><button class="primary" id="layoutSave" ${layoutDirty ? '' : 'disabled'}>Save layout</button></div>
    <div class="lwrap"><div class="card lcats"><div class="muted" style="margin-bottom:6px">Categories (register button order)</div><div class="dz" data-dz="cats">${L.cats.map(c => `<div class="lcat ${c === layoutCat ? 'sel' : ''}" data-lcat="${esc(c)}"><span class="grip" aria-hidden="true">⠿</span><span>${esc(c)}</span><span class="muted">${S.items.filter(i => i.category === c).length}</span></div>`).join('')}</div></div>
      <div class="lmain"><div class="sbar"><b>${esc(layoutCat)}</b><span class="muted">Sections become columns on the register, like Toast.</span><span class="sp"></span><input id="newSec" placeholder="New section, like Breakfast" style="width:220px"><button id="addSec">Add section</button></div>
        <div class="lcols dz" data-dz="secs">${cols.map(sec => `<div class="lcol" data-lsecname="${esc(sec)}"><div class="lcolh">${sec ? `<span class="grip" aria-hidden="true">⠿</span><input data-rensec="${esc(sec)}" value="${esc(sec)}"><button data-delsec="${esc(sec)}" aria-label="Delete section" title="Delete section (items move to No section)">✕</button>` : `<b>${secs.length ? 'No section' : 'Items'}</b>`}</div><div class="dz cards" data-dz="items" data-sec="${esc(sec)}">${layoutItemsIn(layoutCat, sec).map(card).join('')}</div></div>`).join('')}</div></div></div>`;
}
function layoutMark(){ layoutDirty = true; const s = $('#layoutSave'), d = $('#layoutDiscard'); if (s) s.disabled = false; if (d) d.disabled = false; }
function layoutReadDom(){
  L.cats = [...document.querySelectorAll('[data-dz=cats] .lcat')].map(e => e.dataset.lcat);
  const named = [...document.querySelectorAll('.lcol')].map(e => e.dataset.lsecname).filter(Boolean);
  L.sections[layoutCat] = named;
  document.querySelectorAll('.dz.cards').forEach(z => [...z.querySelectorAll('.lcard')].forEach((c, i) => { const x = L.items.get(c.dataset.lid); x.section = z.dataset.sec; x.sortOrder = i; }));
}
// Pointer drag: works with mouse and touch. A short move starts a drag; a tap still taps.
let drag = null;
$('#layoutPane').addEventListener('pointerdown', e => {
  if (e.target.closest('input,select,button,.lmore')) return;
  const el = e.target.closest('.lcard, .lcat, .lcol'); if (!el) return;
  if (el.classList.contains('lcol') && !e.target.closest('.lcolh .grip')) return; // sections drag by their handle
  if (el.classList.contains('lcol') && !el.dataset.lsecname) return;
  drag = {el, x: e.clientX, y: e.clientY, on: false, id: e.pointerId};
});
$('#layoutPane').addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.on){ if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
    drag.on = true; const r = drag.el.getBoundingClientRect();
    drag.ghost = drag.el.cloneNode(true); Object.assign(drag.ghost.style, {position:'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', pointerEvents:'none', opacity:.9, zIndex:50, boxShadow:'0 8px 24px rgba(0,0,0,.18)'});
    drag.dx = e.clientX - r.left; drag.dy = e.clientY - r.top; document.body.appendChild(drag.ghost); drag.el.classList.add('dragging');
    try { $('#layoutPane').setPointerCapture(drag.id); } catch {}
  }
  e.preventDefault();
  if (e.clientY < 70) scrollBy(0, -18); else if (e.clientY > innerHeight - 70) scrollBy(0, 18); // auto-scroll near the edges
  drag.ghost.style.left = (e.clientX - drag.dx) + 'px'; drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
  const kind = drag.el.classList.contains('lcard') ? 'items' : drag.el.classList.contains('lcat') ? 'cats' : 'secs';
  const under = document.elementFromPoint(e.clientX, e.clientY); if (!under) return;
  let zone = kind === 'items' ? (under.closest('.dz.cards') || under.closest('.lcol')?.querySelector('.dz.cards')) : under.closest(`[data-dz=${kind}]`);
  if (!zone) return;
  const sel = kind === 'items' ? '.lcard' : kind === 'cats' ? '.lcat' : '.lcol[data-lsecname]:not([data-lsecname=""])';
  const sibs = [...zone.querySelectorAll(':scope > ' + sel)].filter(x => x !== drag.el);
  const horizontal = kind === 'secs';
  const before = sibs.find(s => { const r = s.getBoundingClientRect(); return horizontal ? e.clientX < r.left + r.width / 2 : e.clientY < r.top + r.height / 2; });
  if (before) zone.insertBefore(drag.el, before); else zone.appendChild(drag.el);
});
function endDrag(){
  if (!drag) return; const d = drag; drag = null;
  if (!d.on){ // a tap
    if (d.el.classList.contains('lcat')){ layoutReadDom(); layoutCat = d.el.dataset.lcat; layoutOpen = null; renderLayout(); }
    else if (d.el.classList.contains('lcard')){ layoutOpen = layoutOpen === d.el.dataset.lid ? null : d.el.dataset.lid; layoutReadDom(); renderLayout(); }
    return;
  }
  d.ghost.remove(); d.el.classList.remove('dragging');
  // dropping an item on a category moves it to that category
  layoutReadDom(); layoutMark(); renderLayout();
}
$('#layoutPane').addEventListener('pointerup', endDrag);
$('#layoutPane').addEventListener('pointercancel', endDrag);
$('#layoutPane').addEventListener('change', e => {
  const t = e.target; const card = t.closest('.lcard'); const x = card && L.items.get(card.dataset.lid);
  if (t.dataset.lday !== undefined && x){ const n = Number(t.dataset.lday); const od = openDays(); let days = x.days ? [...x.days] : [...od]; days = t.checked ? [...new Set([...days, n])] : days.filter(d => d !== n); x.days = od.every(d => days.includes(d)) ? null : days.sort(); layoutMark(); renderLayout(); }
  if (t.dataset.lactive !== undefined && x){ x.active = t.checked; layoutMark(); renderLayout(); }
  if (t.dataset.lsec !== undefined && x){ x.section = t.value; x.sortOrder = 9999; layoutMark(); renderLayout(); }
  if (t.dataset.rensec){ const old = t.dataset.rensec, nu = t.value.trim(); const secs = L.sections[layoutCat] || [];
    if (!nu || (nu !== old && secs.includes(nu))){ status('#layoutStatus', nu ? 'There is already a section with that name.' : 'A section needs a name.', 'err'); renderLayout(); return; }
    L.sections[layoutCat] = secs.map(s => s === old ? nu : s); for (const i of S.items) if (i.category === layoutCat && L.items.get(i.id).section === old) L.items.get(i.id).section = nu; layoutMark(); renderLayout(); }
});
$('#layoutPane').addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'addSec'){ const n = $('#newSec').value.trim(); const secs = L.sections[layoutCat] || []; if (!n || secs.includes(n)) return; layoutReadDom(); L.sections[layoutCat] = [...secs, n]; layoutMark(); renderLayout(); return; }
  if (t.dataset.delsec){ layoutReadDom(); const s = t.dataset.delsec; L.sections[layoutCat] = (L.sections[layoutCat] || []).filter(x => x !== s); for (const i of S.items) if (i.category === layoutCat && L.items.get(i.id).section === s) L.items.get(i.id).section = ''; layoutMark(); renderLayout(); return; }
  if (t.id === 'layoutDiscard'){ layoutInit(); renderLayout(); status('#layoutStatus', 'Changes discarded.'); return; }
  if (t.id === 'layoutSave'){
    try {
      layoutReadDom(); status('#layoutStatus', 'Saving…');
      const changed = S.items.filter(i => { const x = L.items.get(i.id); return (i.section || '') !== x.section || (i.sortOrder ?? 999) !== x.sortOrder || JSON.stringify(i.days || null) !== JSON.stringify(x.days) || (i.active !== false) !== x.active; })
        .map(i => { const x = L.items.get(i.id); return {...i, section: x.section, sortOrder: x.sortOrder, days: x.days, active: x.active}; });
      if (changed.length) await store.saveItems(changed);
      await store.saveSettings({...S.settings, categories: L.cats, sections: L.sections});
      await reload(); layoutInit(); renderLayout(); status('#layoutStatus', `Saved (${changed.length} item${changed.length === 1 ? '' : 's'}).`, 'ok');
    } catch (err){ console.error(err); status('#layoutStatus', 'Could not save: ' + (err.message || err), 'err'); }
  }
});

// ---------- CSV ----------
function csvCell(v){ const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function exportCsv(){
  const cols = sizeCols();
  const head = ['id', 'name', 'category', 'station', 'price', ...cols.map(c => c.label), 'register', 'kiosk', 'online', 'taxed'];
  const lines = [head.map(csvCell).join(',')];
  for (const it of visibleRows()){
    const sized = hasSizes(it);
    lines.push([it.id, it.name, it.category, it.station, sized ? '' : (it.versions?.[0]?.price ?? ''),
      ...cols.map(c => { const v = (it.versions || []).find(x => x.temp === c.t && x.size === c.s); return v && v.price !== null ? v.price : ''; }),
      ...['register', 'kiosk', 'online'].map(k => it.visible?.[k] === false ? 'no' : 'yes'), it.taxable ? 'yes' : 'no'].map(csvCell).join(','));
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lines.join('\n')], {type:'text/csv'})); a.download = 'proofpos-menu.csv'; document.body.appendChild(a); a.click(); a.remove();
  sheetMsg('Downloaded proofpos-menu.csv. Fill it in, then Upload CSV.', 'ok');
}
function parseCsv(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"' && text[i + 1] === '"'){ cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true; else if (c === ','){ row.push(cell); cell = ''; } else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += c;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
async function importCsv(file){
  const rows = parseCsv(await file.text()); if (rows.length < 2){ sheetMsg('That file has no rows.', 'err'); return; }
  const head = rows[0].map(h => h.trim().toLowerCase()); const col = name => head.indexOf(name);
  const sizes = S.settings.sizes || [];
  const sizeHeads = head.map((h, i) => { const m = h.match(/^(hot|iced)?\s*(.+)$/); if (!m) return null; const sz = sizes.find(x => x.toLowerCase() === m[2].trim()); return sz ? {i, t: m[1] || '', s: sz} : null; }).filter(Boolean);
  const yes = v => /^(y|yes|true|1|x)$/i.test(String(v).trim());
  let changed = 0, created = 0, skipped = 0;
  for (const r of rows.slice(1)){
    const get = n => { const i = col(n); return i < 0 ? undefined : (r[i] ?? '').trim(); };
    const name = get('name'); let id = get('id');
    let it = id && itemNow(id);
    if (!it && name){ it = allItemsNow().find(x => x.name.trim().toLowerCase() === name.toLowerCase()); }
    let isNewRow = false;
    if (!it){ if (!name){ skipped++; continue; } id = uniqueId(name); draftItems.set(id, {id, name, description:'', category:'', station:'none', visible:{register:true, kiosk:true, online:true}, alcohol:false, eightySixed:false, versions:[{temp:'', size:'', price:null}], modifierGroupIds:[], counts:[], review:null, taxable:false}); it = itemNow(id); created++; isNewRow = true; }
    const hadDraft = draftItems.has(it.id); const before = JSON.stringify({...itemNow(it.id), review: null});
    editItem(it.id, x => {
      if (name) x.name = name;
      const c = get('category'); if (c) x.category = c;
      const st = get('station'); if (st && STATIONS[st]) x.station = st;
      for (const sh of sizeHeads){ const v = (r[sh.i] ?? '').trim().replace('$', ''); if (v !== '') setPrice(x, sh.t, sh.s, v); }
      const p = get('price'); if (p !== undefined && p !== '' && !hasSizes(x)) setPrice(x, '', '', p.replace('$', ''));
      for (const k of ['register', 'kiosk', 'online']){ const v = get(k); if (v !== undefined && v !== '') x.visible = {...(x.visible || {}), [k]: yes(v)}; }
      const tx = get('taxed'); if (tx !== undefined && tx !== '') x.taxable = yes(tx);
    });
    if (!isNewRow){
      const after = JSON.stringify({...itemNow(it.id), review: null});
      if (after === before){ if (!hadDraft) draftItems.delete(it.id); } else changed++;
    }
  }
  $('#csvIn').value = '';
  renderSheet(); sheetMsg(`Read the file: ${changed} items updated, ${created} new${skipped ? `, ${skipped} rows skipped (no name)` : ''}. Check the highlighted rows, then Save.`, 'ok');
}

// ---------- Start ----------
if (DEMO){
  store = memoryStore(); $('#appView').classList.remove('hidden'); $('#whoName').textContent = 'Demo mode (nothing is saved)'; $('#signOut').classList.add('hidden'); reload();
} else {
  const {initializeApp} = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const A = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
  const app = initializeApp(firebaseConfig); const auth = A.getAuth(app); authRef = auth;
  store = await firestoreStore(app);
  A.onAuthStateChanged(auth, user => {
    $('#loginView').classList.toggle('hidden', !!user); $('#appView').classList.toggle('hidden', !user);
    if (user){ signedInEmail = user.email || ''; $('#whoName').textContent = user.email; reload().catch(err => { $('#editPane').innerHTML = `<p class="status err">Could not load the menu: ${esc(err.message)}</p>`; }); }
  });
  $('#signIn').addEventListener('click', async () => {
    status('#loginStatus', 'Signing in…');
    try { await A.signInWithEmailAndPassword(auth, $('#email').value.trim(), $('#password').value); }
    catch (err){ status('#loginStatus', 'That email and password did not work.', 'err'); }
  });
  $('#password').addEventListener('keydown', e => { if (e.key === 'Enter') $('#signIn').click(); });
  $('#signOut').addEventListener('click', () => A.signOut(auth));
}
