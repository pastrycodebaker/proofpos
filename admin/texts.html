<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/icons/icon-192.png">
<title>Proof POS · Texts</title>
<style>
  :root{--line:#dfe3e8;--quiet:#5b6470;--accent:#1a5fb4;--accent-bg:#e7f0fb;--ok:#1a7f37;--crit:#b42318}
  *{box-sizing:border-box}
  body{margin:0;background:#eef1f4;color:#1f2328;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;gap:10px;align-items:center;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0}
  main{max-width:900px;margin:0 auto;padding:16px 18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  button,input,select{font:inherit;color:inherit}
  button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{color:var(--crit);border-color:#f0c4bf}
  input,select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
  label{display:block;font-size:13px;color:var(--quiet);margin:8px 0 4px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row > div{flex:1;min-width:140px}
  .checks{display:flex;gap:8px;flex-wrap:wrap}
  .checks label{display:flex;gap:6px;align-items:center;margin:0;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:inherit;font-size:14px}
  .checks input{width:auto}
  .muted{color:var(--quiet)}.ok{color:var(--ok)}.err{color:var(--crit)}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .sp{flex:1}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#bbb;margin-right:6px}
  .dot.on{background:var(--ok)}.dot.off{background:var(--crit)}
  .hidden{display:none !important}
  ol li{margin-bottom:6px}
  code{background:#f2f4f7;padding:1px 5px;border-radius:5px}
  textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-height:80px;background:#fff}
  .preview{background:#e9f6ec;border-radius:14px 14px 14px 4px;padding:10px 12px;margin-top:8px;white-space:pre-wrap;max-width:420px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;color:var(--quiet);font-weight:600}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;background:#eef1f4;font-size:12px;margin:0 3px 3px 0}
  .stat{display:inline-block;margin-right:18px}.stat b{font-size:22px;display:block}
  h3{margin:0 0 6px}
</style>
</head>
<body>
<header><h1>Texts</h1><span class="sp" style="flex:1"></span><a href="../?pick" id="switchLink" class="muted">Switch screen</a></header>
<div id="login" class="card hidden" style="max-width:360px;margin:60px auto">
  <h3 style="margin-top:0">Sign in</h3>
  <input id="email" type="email" placeholder="Email" aria-label="Email" style="margin-bottom:8px">
  <input id="password" type="password" placeholder="Password" aria-label="Password">
  <button class="primary" id="signIn" style="width:100%;margin-top:10px">Sign in</button>
  <div class="err" id="loginErr"></div>
</div>
<main id="app" class="hidden">
  <div class="card" id="statusCard"></div>
  <div class="card">
    <h3>Sign-up page</h3>
    <p class="muted" style="margin:0 0 8px">Share this link (or a QR code of it) on the website, receipts, and a sign by the register. People pick their lists and agree there; you can't add numbers yourself, because carriers require each person's own sign-up.</p>
    <div class="row"><div style="flex:3"><input id="signupLink" readonly></div><div style="flex:0"><button id="copyLink">Copy</button></div></div>
  </div>
  <div class="card" id="weeklyCard"></div>
  <div class="card" id="sendCard"></div>
  <div class="card" id="historyCard"></div>
  <div class="card" id="subsCard"></div>
</main>
<script type="module">
import { firebaseConfig } from '../firebase-config.js';
import { LISTS, listName, finalText, segments, textSettings, prettyPhone, phone10, DEFAULT_WEEKLY } from '../shared/texts.mjs';
const DEMO = new URLSearchParams(location.search).has('demo');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
if (DEMO) $('#switchLink').href = '../?pick&demo';
const SIGNUP = (DEMO || location.hostname.endsWith('netlify.app') ? location.origin : 'https://order.flourandsalt.com') + '/texts/';
$('#signupLink').value = SIGNUP;
$('#copyLink').addEventListener('click', () => { navigator.clipboard?.writeText(SIGNUP); $('#copyLink').textContent = 'Copied'; setTimeout(() => $('#copyLink').textContent = 'Copy', 1500); });
let store, SUBS = [], BLASTS = [], SET = {}, texting = null, q = '';
const when = ms => ms ? new Date(ms).toLocaleString([], {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}) : '';

function demoStore(){
  const now = Date.now();
  let subs = [['3155550101', 'Maya', ['weekly', 'specials']], ['3155550102', 'Theo', ['weekly']], ['3155550103', 'Rae', ['weekly', 'specials', 'closures']], ['3155550104', 'Sam', ['closures']]]
    .map(([phone, name, l], i) => ({phone, name, lists: Object.fromEntries(LISTS.map(x => [x[0], l.includes(x[0])])), active: i !== 3, createdAt: now - i * 86400000 * 3, stoppedAt: i === 3 ? now - 86400000 : null}));
  let blasts = [{id: 'b1', list: 'weekly', body: 'Pre-orders for this week close tomorrow (Monday) at 1pm. Order at order.flourandsalt.com', status: 'sent', sendAt: now - 5 * 86400000, sentAt: now - 5 * 86400000, sent: 3, failed: 0, total: 3, kind: 'weekly', by: 'automatic'}];
  let set = {}; const subsCb = [], blCb = [], setCb = [];
  const emit = () => { subsCb.forEach(f => f(structuredClone(subs))); blCb.forEach(f => f(structuredClone(blasts))); setCb.forEach(f => f(structuredClone(set))); };
  return {
    watchSubs(f){ subsCb.push(f); f(structuredClone(subs)); }, watchBlasts(f){ blCb.push(f); f(structuredClone(blasts)); }, watchSettings(f){ setCb.push(f); f(structuredClone(set)); },
    async saveSettings(x){ set = {...set, ...x}; emit(); },
    async addBlast(b){ blasts.unshift({...b, id: Math.random().toString(36).slice(2)}); emit(); },
    async cancelBlast(id){ const b = blasts.find(x => x.id === id); if (b) b.status = 'cancelled'; emit(); },
    async removeSub(p){ const s = subs.find(x => x.phone === p); if (s){ s.active = false; s.stoppedAt = Date.now(); s.removedBy = 'staff'; } emit(); },
    async api(action){ if (action === 'status') return {texting: false}; throw new Error('Demo: texts are not sent.'); },
  };
}
async function firebaseStore(app, auth){
  const F = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js'); const db = F.getFirestore(app);
  return {
    watchSubs(f){ F.onSnapshot(F.collection(db, 'textSubs'), s => f(s.docs.map(d => d.data()))); },
    watchBlasts(f){ F.onSnapshot(F.query(F.collection(db, 'textBlasts'), F.orderBy('createdAt', 'desc'), F.limit(25)), s => f(s.docs.map(d => ({...d.data(), id: d.id})))); },
    watchSettings(f){ F.onSnapshot(F.doc(db, 'settings', 'texts'), s => f(s.exists() ? s.data() : {})); },
    saveSettings: x => F.setDoc(F.doc(db, 'settings', 'texts'), x, {merge: true}),
    addBlast: b => F.addDoc(F.collection(db, 'textBlasts'), b),
    cancelBlast: id => F.updateDoc(F.doc(db, 'textBlasts', id), {status: 'cancelled'}),
    removeSub: p => F.updateDoc(F.doc(db, 'textSubs', p), {active: false, stoppedAt: Date.now(), removedBy: auth.currentUser?.email || 'staff'}),
    async api(action, body = {}){
      const r = await fetch('/.netlify/functions/texts', {method: 'POST', headers: {'content-type': 'application/json', authorization: 'Bearer ' + await auth.currentUser.getIdToken()}, body: JSON.stringify({action, ...body})});
      const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'That did not work.'); return j;
    },
  };
}

const active = () => SUBS.filter(s => s.active);
const countFor = id => active().filter(s => s.lists && s.lists[id]).length;

function renderStatus(){
  $('#statusCard').innerHTML = `<h3>${texting ? '<span class="dot on"></span>Texting is on' : '<span class="dot off"></span>Texting is not set up yet'}</h3>
    <p class="muted" style="margin:0">${texting ? 'Texts go out from your Twilio number.' : 'Everything here works and saves, but no texts go out until Twilio approves the campaign and the TWILIO keys are added in Netlify. Sign-ups are still collected.'}</p>
    <div style="margin-top:10px">${LISTS.map(([id, name]) => `<span class="stat"><b>${countFor(id)}</b>${esc(name)}</span>`).join('')}</div>`;
}
function renderWeekly(){
  const s = textSettings(SET); const ex = finalText(s.weeklyText.replace('{deadline}', 'tomorrow (Monday) at 1pm'));
  $('#weeklyCard').innerHTML = `<h3>Sunday pre-order reminder</h3>
    <p class="muted" style="margin:0 0 8px">Goes to the Weekly pre-order reminder list every Sunday. It skips weeks when pre-orders are closed. {deadline} fills in the deadline from your online ordering settings.</p>
    <div class="checks"><label><input type="checkbox" id="wOn" ${s.weeklyOn ? 'checked' : ''}> Send it every Sunday</label>
      <label>at <select id="wTime" style="width:auto;padding:4px 6px">${['16:00', '17:00', '18:00', '19:00', '20:00'].map(t => `<option ${s.weeklyTime === t ? 'selected' : ''} value="${t}">${Number(t.slice(0, 2)) - 12}pm</option>`).join('')}</select></label></div>
    <label for="wText">Message</label><textarea id="wText">${esc(s.weeklyText)}</textarea>
    <div class="preview" id="wPrev">${esc(ex)}</div><div class="muted" id="wLen" style="font-size:13px;margin-top:4px">${ex.length} characters · ${segments(ex)} text${segments(ex) > 1 ? 's' : ''} each</div>
    <div class="bar"><button id="wSkip">${s.skipDate && s.skipDate >= today() ? 'Skipping ' + s.skipDate + ' · undo' : 'Skip this Sunday'}</button><button id="wDefault">Use the standard wording</button><span class="sp"></span><span id="wMsg"></span><button class="primary" id="wSave">Save</button></div>
    ${s.lastWeekly ? `<p class="muted" style="font-size:13px;margin:8px 0 0">Last sent ${esc(s.lastWeekly)}.</p>` : ''}`;
  const upd = () => { const t = finalText($('#wText').value.replace('{deadline}', 'tomorrow (Monday) at 1pm')); $('#wPrev').textContent = t; $('#wLen').textContent = `${t.length} characters · ${segments(t)} text${segments(t) > 1 ? 's' : ''} each`; };
  $('#wText').addEventListener('input', upd);
}
const today = () => new Intl.DateTimeFormat('en-CA', {timeZone: 'America/New_York'}).format(new Date());
const nextSunday = () => { const d = new Date(today() + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + ((7 - d.getUTCDay()) % 7)); return d.toISOString().slice(0, 10); };
function renderSend(){
  $('#sendCard').innerHTML = `<h3>Send a text</h3>
    <div class="row"><div><label for="sList">To</label><select id="sList">${LISTS.filter(l => l[0] !== 'weekly').concat(LISTS.filter(l => l[0] === 'weekly')).map(([id, name]) => `<option value="${id}">${esc(name)} (${countFor(id)})</option>`).join('')}</select></div>
      <div><label for="sWhen">When</label><select id="sWhen"><option value="now">Now</option><option value="later">Later…</option></select></div>
      <div class="hidden" id="sAtBox"><label for="sAt">Send at</label><input type="datetime-local" id="sAt"></div></div>
    <label for="sBody">Message</label><textarea id="sBody" placeholder="Pumpkin pies are on the pre-order menu for Thanksgiving pickup. Order by Nov 23 at order.flourandsalt.com"></textarea>
    <div class="preview" id="sPrev">Your message shows here, starting with Flour and Salt Bakery LLC and ending with how to opt out.</div><div class="muted" id="sLen" style="font-size:13px;margin-top:4px"></div>
    <div class="bar"><input id="testTo" placeholder="Your cell for a test" style="max-width:200px"><button id="sTest">Send me a test</button><span class="sp"></span><span id="sMsg"></span><button class="primary" id="sGo">Send</button></div>`;
  const upd = () => { const v = $('#sBody').value.trim(); const t = v ? finalText(v) : ''; $('#sPrev').textContent = t || 'Your message shows here, starting with Flour and Salt Bakery LLC and ending with how to opt out.'; $('#sLen').textContent = t ? `${t.length} characters · ${segments(t)} text${segments(t) > 1 ? 's' : ''} per person` : ''; };
  $('#sBody').addEventListener('input', upd);
  $('#sWhen').addEventListener('change', () => $('#sAtBox').classList.toggle('hidden', $('#sWhen').value !== 'later'));
}
function renderHistory(){
  const st = b => b.status === 'sent' ? `<span class="ok">Sent</span> ${b.sent || 0}${b.failed ? `, ${b.failed} didn't go through` : ''}` : b.status === 'sending' ? `Sending… ${b.sent || 0} of ${b.total || '?'}` : b.status === 'cancelled' ? '<span class="muted">Cancelled</span>' : `Scheduled for ${when(b.sendAt)}`;
  $('#historyCard').innerHTML = `<h3>Recent texts</h3>${BLASTS.length ? `<table><thead><tr><th>When</th><th>To</th><th>Message</th><th>Status</th><th></th></tr></thead><tbody>${BLASTS.map(b => `<tr><td>${when(b.sendAt)}</td><td>${esc(listName(b.list))}${b.kind === 'weekly' ? '<br><span class="muted" style="font-size:12px">automatic</span>' : ''}</td><td>${esc(b.body)}</td><td>${st(b)}</td><td>${b.status === 'queued' ? `<button class="danger" data-cancel="${esc(b.id)}">Cancel</button>` : ''}</td></tr>`).join('')}</tbody></table>` : '<p class="muted" style="margin:0">Nothing sent yet.</p>'}`;
}
function renderSubs(){
  const list = SUBS.filter(s => !q || (s.name || '').toLowerCase().includes(q.toLowerCase()) || s.phone.includes(q.replace(/\D/g, '') || '~')).sort((a, b) => (b.active - a.active) || (b.createdAt || 0) - (a.createdAt || 0));
  $('#subsCard').innerHTML = `<h3>People signed up</h3>
    <div class="bar" style="margin:0 0 8px"><input id="subQ" placeholder="Search name or number" value="${esc(q)}" style="max-width:260px"><span class="sp"></span><button id="csv">Download CSV</button></div>
    <table><thead><tr><th>Name</th><th>Number</th><th>Lists</th><th>Signed up</th><th></th></tr></thead><tbody>${list.map(s => `<tr${s.active ? '' : ' class="muted"'}><td>${esc(s.name || '')}</td><td>${esc(prettyPhone(s.phone))}</td><td>${LISTS.filter(l => s.lists && s.lists[l[0]]).map(l => `<span class="pill">${esc(l[1])}</span>`).join('')}</td><td>${when(s.createdAt)}</td><td>${s.active ? `<button class="danger" data-rm="${esc(s.phone)}">Remove</button>` : `Stopped ${when(s.stoppedAt)}`}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No one yet.</td></tr>'}</tbody></table>`;
  const inp = $('#subQ'); inp.addEventListener('input', () => { q = inp.value; renderSubs(); $('#subQ').focus(); $('#subQ').setSelectionRange(q.length, q.length); });
}
const renderAll = () => { renderStatus(); renderHistory(); renderSubs(); };

document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  const msg = (id, text, cls = 'ok') => { const el = $('#' + id); el.className = cls; el.textContent = text; };
  try {
    if (t.id === 'wSave'){ await store.saveSettings({weeklyOn: $('#wOn').checked, weeklyText: $('#wText').value.trim() || DEFAULT_WEEKLY, weeklyTime: $('#wTime').value}); msg('wMsg', 'Saved'); }
    if (t.id === 'wDefault'){ $('#wText').value = DEFAULT_WEEKLY; $('#wText').dispatchEvent(new Event('input')); }
    if (t.id === 'wSkip'){ const s = textSettings(SET); await store.saveSettings({skipDate: s.skipDate && s.skipDate >= today() ? null : nextSunday()}); }
    if (t.dataset.cancel){ if (confirm('Cancel this scheduled text?')) await store.cancelBlast(t.dataset.cancel); }
    if (t.dataset.rm){ if (confirm('Remove this number from every list? They can sign up again on the sign-up page.')) await store.removeSub(t.dataset.rm); }
    if (t.id === 'sTest'){ if (!phone10($('#testTo').value)) return msg('sMsg', 'Enter your cell number first.', 'err'); if (!$('#sBody').value.trim()) return msg('sMsg', 'Write the message first.', 'err'); await store.api('test', {to: $('#testTo').value, body: $('#sBody').value}); msg('sMsg', 'Test sent'); }
    if (t.id === 'sGo'){
      const body = $('#sBody').value.trim(), list = $('#sList').value, n = countFor(list);
      if (!body) return msg('sMsg', 'Write the message first.', 'err');
      let sendAt = Date.now();
      if ($('#sWhen').value === 'later'){ sendAt = new Date($('#sAt').value).getTime(); if (!sendAt || sendAt < Date.now()) return msg('sMsg', 'Pick a time in the future.', 'err'); }
      if (!confirm(`${$('#sWhen').value === 'later' ? 'Schedule' : 'Send'} this text to ${n} ${n === 1 ? 'person' : 'people'} on ${listName(list)}?\n\n${finalText(body)}`)) return;
      await store.addBlast({list, body, status: 'queued', sendAt, createdAt: Date.now(), sent: 0, failed: 0, kind: 'manual', by: 'Texts page'});
      $('#sBody').value = ''; $('#sBody').dispatchEvent(new Event('input'));
      msg('sMsg', $('#sWhen').value === 'later' ? `Scheduled for ${when(sendAt)}` : 'Sending now. It goes out within 10 minutes.');
    }
    if (t.id === 'csv'){
      const rows = [['Name', 'Phone', ...LISTS.map(l => l[1]), 'Signed up', 'Active']].concat(SUBS.map(s => [s.name || '', s.phone, ...LISTS.map(l => s.lists && s.lists[l[0]] ? 'yes' : ''), new Date(s.createdAt || 0).toISOString().slice(0, 10), s.active ? 'yes' : 'no']));
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n')], {type: 'text/csv'})); a.download = 'text-signups.csv'; a.click();
    }
  } catch (err){ const box = t.closest('.card')?.querySelector('[id$=Msg]'); if (box){ box.className = 'err'; box.textContent = err.message; } else alert(err.message); }
});

async function boot(){
  $('#app').classList.remove('hidden'); $('#login').classList.add('hidden');
  store.watchSettings(s => { SET = s; renderWeekly(); });
  store.watchSubs(s => { SUBS = s; renderAll(); renderSend(); });
  store.watchBlasts(b => { BLASTS = b; renderHistory(); });
  try { texting = (await store.api('status')).texting; } catch (e){ texting = false; } renderStatus();
}
if (DEMO){ store = demoStore(); boot(); }
else {
  const {initializeApp} = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const A = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
  const app = initializeApp(firebaseConfig); const auth = A.getAuth(app); store = await firebaseStore(app, auth); let booted = false;
  A.onAuthStateChanged(auth, u => { if (u && !booted){ booted = true; boot(); } if (!u) $('#login').classList.remove('hidden'); });
  $('#signIn').addEventListener('click', async () => { try { await A.signInWithEmailAndPassword(auth, $('#email').value.trim(), $('#password').value); } catch (e){ $('#loginErr').textContent = 'That email and password did not work.'; } });
}
</script>
</body>
</html>
