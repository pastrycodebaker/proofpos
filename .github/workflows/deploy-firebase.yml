name: Deploy Firebase
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
      - scripts/deploy-rules.sh
      - functions/**
      - .github/workflows/deploy-firebase.yml
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: projects/85570970040/locations/global/workloadIdentityPools/github/providers/proofpos
          service_account: github-deployer@proofpos-90500.iam.gserviceaccount.com
      - name: Deploy Firestore rules
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: ./scripts/deploy-rules.sh
