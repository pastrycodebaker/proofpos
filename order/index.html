<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F7F3EC">
<link rel="icon" href="/icons/icon-192.png">
<title>Order ahead · Flour &amp; Salt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F7F3EC;--card:#fff;--ink:#2B2622;--quiet:#6B6157;--soft:#EFE7DA;--line:#E3D9CA;--accent:#1F5C55;--accent-bg:#E6F0EE;--warn:#F2C14E;--crit:#A32D1F}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Inter,system-ui,sans-serif}
  button{font:inherit;color:inherit;border:0;background:var(--card);border-radius:14px;padding:12px 16px;cursor:pointer}
  button.primary{background:var(--accent);color:#fff;font-weight:700}
  button.primary:disabled{background:#9DB5B1;cursor:default}
  input{font:inherit;color:inherit;border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;background:#fff}
  input:focus{outline:none;border-color:var(--accent)}
  h1,h2,h3{font-family:"Bricolage Grotesque",Inter,sans-serif;font-weight:800;margin:0;letter-spacing:-.01em}
  .muted{color:var(--quiet)} .err{color:var(--crit);font-weight:600} .hidden{display:none !important}
  .wrap{max-width:980px;margin:0 auto;padding:16px 16px 120px}
  header.top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:12px}
  header.top .brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px}
  .pickup{background:#fff;border-radius:18px;padding:14px;margin-bottom:14px}
  .pickup h3{font-size:18px;margin-bottom:8px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .chips button{flex:none;border:2px solid var(--line);background:#fff;min-width:96px;text-align:left;padding:10px 12px;line-height:1.2}
  .chips button small{display:block;color:var(--quiet);font-size:13px}
  .chips button.on{border-color:var(--accent);background:var(--accent-bg);font-weight:700}
  .chips button:disabled{opacity:.5}
  .note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
  .note.warn{background:#FFF3D6}
  .cats{display:flex;gap:8px;overflow-x:auto;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:3}
  .cats button{flex:none;background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px}
  .cats button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  h2.cat{font-size:24px;margin:18px 0 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .tile{text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px;justify-content:space-between;padding:14px 16px}
  .tile .t{font-weight:700;font-size:17px} .tile .d{font-size:14px;color:var(--quiet)} .tile .p{font-weight:600}
  .tile .why{font-size:13px;font-weight:700;color:var(--crit)} .tile .dl{font-size:13px;font-weight:600;color:#8A5A00}
  .tile:disabled{opacity:.55;cursor:default}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:5}
  .bar button{width:100%;max-width:520px;margin:0 auto;display:flex;justify-content:space-between;font-size:18px;padding:16px 20px;border-radius:16px}
  .scrim{position:fixed;inset:0;background:rgba(43,38,34,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  @media(min-width:700px){.scrim{align-items:center;padding:24px}}
  .sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden}
  @media(min-width:700px){.sheet{border-radius:22px}}
  .sheet .hd{padding:18px 20px 6px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .sheet .hd h2{font-size:26px}
  .sheet .bd{padding:4px 20px 14px;overflow:auto;display:flex;flex-direction:column;gap:16px}
  .sheet .ft{padding:14px 20px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);background:#fff}
  .sheet .ft .sp{flex:1}
  .x{background:transparent;font-size:22px;padding:4px 10px}
  .grp h4{margin:0 0 8px;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft)} .tag.need{background:#F6D3CD;color:var(--crit)}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opts button{border:2px solid transparent;display:flex;gap:6px;align-items:center;padding:10px 12px}
  .opts button.on{border-color:var(--accent);background:var(--accent-bg);font-weight:700}
  .opts button small{color:var(--quiet);font-size:13px}
  .opts button:disabled{opacity:.45;text-decoration:line-through}
  .step{display:flex;align-items:center;gap:6px;background:#fff;border-radius:12px;padding:4px 4px 4px 12px;border:2px solid transparent}
  .step.on{border-color:var(--accent);background:var(--accent-bg)} .step span{min-width:110px;font-weight:600;flex:1}
  .grp .step{width:100%}
  .step button{background:var(--soft);padding:8px 14px;font-weight:700} .step b{min-width:22px;text-align:center}
  .ln{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 0;border-bottom:1px solid var(--line)}
  .ln .m{grid-column:1/-1;font-size:14px;color:var(--quiet)} .ln .bad{grid-column:1/-1;font-size:14px;color:var(--crit);font-weight:700}
  .ln button{grid-column:1/-1;justify-self:start;background:transparent;color:var(--crit);padding:2px 0;font-size:14px;font-weight:600}
  .tot div{display:flex;justify-content:space-between;padding:2px 0}
  .tips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tips button{border:2px solid transparent;display:flex;flex-direction:column;align-items:center;padding:10px 6px;font-weight:700}
  .tips button.on{border-color:var(--accent);background:var(--accent-bg)} .tips small{font-weight:500;color:var(--quiet)}
  label{display:block;font-weight:600;margin:0 0 6px;font-size:15px}
  .fields{display:grid;gap:12px}
  #payEl{min-height:60px}
  .choice{display:flex;flex-direction:column;gap:6px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px;color:inherit;text-decoration:none}
  .choice .ct,.day .ct{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px}
  .choice.off{opacity:.5;pointer-events:none}
  .choice .dl,.day .dl{font-weight:700;color:#8A5A00;font-size:15px}
  .day{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:2px solid var(--line);text-align:left;padding:14px 16px}
  .day.on{border-color:var(--accent);background:var(--accent-bg)}
  .pickupban{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#FFF3D6;border:2px solid #E0B44C;border-radius:16px;padding:14px 16px;margin-bottom:8px}
  .pickupban.asap{background:var(--accent-bg);border-color:var(--accent)}
  .pickupban .lbl{font-size:13px;font-weight:800;letter-spacing:.06em}
  .pickupban .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;line-height:1.15}
  .pickupban a{font-weight:700;color:var(--accent);flex:none}
  .confirm{display:flex;gap:10px;align-items:flex-start;background:#FFF3D6;border:2px solid #E0B44C;border-radius:12px;padding:12px;font-weight:600}
  .confirm input{width:22px;height:22px;flex:none;margin-top:2px}
  .ln .qty{grid-column:1/-1;display:flex;gap:6px;align-items:center;margin-top:4px}
  .ln .qty button{background:var(--soft);padding:4px 12px;font-weight:800;border-radius:10px;color:var(--ink);grid-column:auto}
  .ln .qty button.rmall{background:transparent;color:var(--crit);font-weight:600;font-size:14px;margin-left:6px}
  .ln .qty b{min-width:20px;text-align:center}
  .missing input:not([type=checkbox]){border-color:var(--crit);background:#FFF5F3}
  .missing.confirm,.missing.tips{outline:3px solid var(--crit);outline-offset:3px;border-radius:12px}
  .fielderr{color:var(--crit);font-weight:700;font-size:14px;margin-top:4px;grid-column:1/-1;width:100%}
  .done{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
  .done h1{font-size:40px}
  .done .num{font-size:22px;font-weight:700;background:#fff;padding:10px 22px;border-radius:999px}
  /* ---- Look and feel ---- */
  body{background:var(--bg) radial-gradient(circle at 20% -10%, #FBE9CF 0, transparent 45%) no-repeat}
  .wrap{max-width:1040px}
  header.top{flex-direction:column;align-items:center;text-align:center;gap:2px;padding:18px 0 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
  header.top .brand{font-size:38px;letter-spacing:-.02em;line-height:1}
  header.top .sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--quiet);font-weight:600;margin-top:4px}
  header.top .slogan{font-family:"Bricolage Grotesque",sans-serif;font-size:15px;color:#8A5A00;margin-top:2px}
  .choice{flex-direction:row;align-items:center;gap:16px;padding:20px;box-shadow:0 1px 0 var(--line),0 8px 24px -16px rgba(43,38,34,.35);transition:transform .15s,box-shadow .15s}
  .choice:hover{transform:translateY(-2px);box-shadow:0 1px 0 var(--line),0 14px 30px -16px rgba(43,38,34,.45)}
  .choice .ic{width:56px;height:56px;border-radius:16px;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;flex:none}
  .choice.pre .ic{background:#FFF0CC}
  .choice .tx{display:flex;flex-direction:column;gap:4px}
  .choice .go{margin-left:auto;font-size:26px;color:var(--accent);flex:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
  @media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
  .tile{padding:0;overflow:hidden;min-height:0;justify-content:flex-start;gap:0;border:1px solid var(--line);box-shadow:0 6px 18px -14px rgba(43,38,34,.4);transition:transform .15s}
  .tile:not(:disabled):hover{transform:translateY(-2px)}
  .tile .ph{aspect-ratio:4/3;width:100%;background:linear-gradient(135deg,#F1E4CF,#E7D3B5);display:flex;align-items:center;justify-content:center}
  .tile .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .tile .ph .ini{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:44px;color:rgba(43,38,34,.18)}
  .tile .tb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1;width:100%}
  .tile .t{font-size:16px;line-height:1.25}
  .tile .d{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px}
  .tile .p{margin-top:auto;padding-top:4px;font-weight:700;color:var(--accent)}
  .tile:disabled{opacity:.6} .tile:disabled .ph img{filter:grayscale(1)}
  h2.cat{font-size:26px;margin:26px 0 12px}
  .cats{backdrop-filter:blur(8px);background:rgba(247,243,236,.88);margin:0 -16px;padding:10px 16px;border-bottom:1px solid var(--line)}
  .sheet .hero{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;max-height:280px}
  .pickupban{box-shadow:0 8px 24px -18px rgba(43,38,34,.5)}
  footer.foot{text-align:center;color:var(--quiet);font-size:13px;margin-top:40px;padding-top:16px;border-top:1px solid var(--line)}
  /* ---- Simple storefront ---- */
  body{background:var(--bg)}
  .wrap{max-width:920px}
  header.hero{margin:0 0 18px}
  header.hero .banner{margin:-16px -16px 0;height:190px;overflow:hidden;background:var(--soft)}
  @media(min-width:700px){header.hero .banner{margin:0;border-radius:0 0 22px 22px;height:260px}}
  header.hero .banner img{width:100%;height:100%;object-fit:cover;display:block}
  header.hero .id{display:flex;align-items:center;gap:12px;padding:16px 0 4px}
  header.hero.has .id{margin-top:-34px}
  header.hero .logo{width:68px;height:68px;border-radius:50%;border:4px solid var(--bg);background:#fff;flex:none;object-fit:cover}
  header.hero.has .id > div{padding-top:30px}
  header.hero .brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:28px;color:inherit;text-decoration:none;line-height:1}
  header.hero .sub{color:var(--quiet);font-size:14px;margin-top:3px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .choice{flex-direction:column;align-items:flex-start;gap:4px;padding:22px 18px;box-shadow:0 8px 24px -18px rgba(43,38,34,.4)}
  .choice .ct{font-size:24px}
  .back{color:var(--quiet);font-weight:600;text-decoration:none}
  h1.pg{font-size:28px;margin:8px 0 14px} h2.pg2{font-size:20px;margin:22px 0 10px}
  .wk{margin:0 0 14px}
  .wk .by{font-size:13px;font-weight:700;color:#8A5A00;margin:0 0 6px}
  .dates{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
  @media(min-width:700px){.dates{grid-template-columns:repeat(7,1fr)}}
  .date{display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 4px;border:2px solid var(--line);line-height:1.15}
  .date small{font-size:12px;color:var(--quiet);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  .date b{font-family:"Bricolage Grotesque",sans-serif;font-size:26px}
  .date.on{border-color:var(--accent);background:var(--accent)} .date.on small,.date.on b{color:#fff}
  .times{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .time{border:2px solid var(--line);font-weight:600;padding:12px 6px}
  .time.on{border-color:var(--accent);background:var(--accent-bg)}
  .small{font-size:14px;margin-top:14px}
  .pick{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:0 0 6px;font-weight:700}
  .pick small{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--quiet);margin-right:6px}
  .pick a{color:var(--accent);font-weight:700}
  .faq{margin-top:36px} .faq h2{font-size:22px;margin:0 0 8px}
  .faq details{background:#fff;border:1px solid var(--line);border-radius:12px;margin:0 0 8px;padding:0 16px}
  .faq summary{cursor:pointer;font-weight:600;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:10px}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary::after{content:'+';color:var(--quiet);font-weight:700}
  .faq details[open] summary::after{content:'–'}
  .faq details p{margin:0 0 14px;color:var(--quiet);white-space:pre-line}
  .giftbox{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  button.link{background:transparent;color:var(--accent);font-weight:700;padding:4px 0}
  footer.foot{margin-top:28px} footer.foot a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Loading the menu…</p></div>
<div class="bar hidden" id="bar"><button class="primary" id="cartBtn"><span id="cartCount"></span><span id="cartTotal"></span></button></div>
<div id="sheetRoot"></div>
<script type="module">
import { firebaseConfig } from '../firebase-config.js';
import * as R from '../shared/online.mjs';
const DEMO = new URLSearchParams(location.search).has('demo');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const money = n => '$' + (Number(n) || 0).toFixed(2);
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };

let M = {items: [], groups: [], settings: {}, status: {}, kds: {}};
let pickup = {type: 'asap'}, cart = [], cat = null, draft = null, tipPct = null, me = load('fs.me', {name: '', email: '', phone: ''});
const S = () => M.settings || {};
const chan = () => mode() === 'later' ? 'preorder' : 'asap';
const BL = (d) => R.buildLine(M, d, M.kds, chan());
const itemById = id => R.onChannel(M.items.find(i => i.id === id), groupById, chan());
const groupById = id => M.groups.find(g => g.id === id);
const onlineItems = () => M.items.filter(i => !i.archived && i.active !== false && !i.alcohol && i.visible?.online !== false);
const order = (a, b) => (a.sortOrder ?? 999) - (b.sortOrder ?? 999) || a.name.localeCompare(b.name);
let LEFT = {}, leftFor = '';  // how many are left of limited items for the chosen pickup day
async function loadLeft(date){
  if (!date || leftFor === date) return; leftFor = date;
  try { const r = DEMO ? {left: {}} : await api('counts', {date}); LEFT = r.left || {}; render(); } catch (e){ LEFT = {}; }
}
const avail = it => { const a = R.availability(it, pickup, S(), Date.now()); if (!a.ok || pickup.type !== 'date' || LEFT[it.id] === undefined) return a; return LEFT[it.id] <= 0 ? {ok: false, reason: 'Sold out for that day'} : {...a, left: LEFT[it.id]}; };
// What the usual build costs (built-from sandwiches price from their included ingredients).
const fromPrice = it => { const ps = (it.versions || []).map((v, i) => { try { return BL({itemId: it.id, versionIdx: i, mods: [...(it.included || []).map(x => ({g: x.g, o: x.o, q: 1})), ...(it.modifierGroupIds || []).map(groupById).filter(g => g && g.default).map(g => ({g: g.id, o: g.default, q: 1}))]}).price; } catch (e){ return Number(v.price || 0); } }); return ps.length ? Math.min(...ps) : 0; };
const ownDeadline = it => !!(it.deadline || it.preorderOnly || (it.dates || []).length);
const deadlineText = ms => new Date(ms).toLocaleString('en-US', {timeZone: R.TZ, weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'});

// ---------- Data ----------
async function start(){
  if (DEMO){
    const s = await (await fetch('../data/seed-menu.json')).json();
    const demoHours = {3:{open:'07:00',close:'14:00'},4:{open:'07:00',close:'14:00'},5:{open:'07:00',close:'14:00'},6:{open:'08:00',close:'14:00'},0:{open:'08:00',close:'14:00'}};
    const items = s.items.concat([{id:'pumpkin-pie', name:'Pumpkin Pie', category:'Pre-orders', description:'Whole 9" pie. Pick up the day before Thanksgiving.', versions:[{temp:'', size:'', price:34}], modifierGroupIds:[], preorderOnly:true, dates:[R.addDays(R.nyDate(), 15), R.addDays(R.nyDate(), 16)], deadline:{daysBefore:3, time:'17:00'}, dateLimit:40, visible:{register:true, kiosk:false, online:true}, station:'none'}]);
    M = {items, groups: s.modifierGroups, settings: {...s.settings, online: {hours: demoHours, prepMinutes: 15, headerImage: new URLSearchParams(location.search).get('hdr') || ''}, categories: [...s.settings.categories, 'Pre-orders']}, status: {}, kds: {}};
    render(); return;
  }
  const {initializeApp} = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const F = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
  const db = F.getFirestore(initializeApp(firebaseConfig));
  const got = {i: false, g: false, s: false};
  const fire = () => { if (got.i && got.g && got.s) render(); };
  F.onSnapshot(F.collection(db, 'menu', 'main', 'items'), s => { M.items = s.docs.map(d => d.data()); got.i = true; fire(); });
  F.onSnapshot(F.collection(db, 'menu', 'main', 'modifierGroups'), s => { M.groups = s.docs.map(d => d.data()); got.g = true; fire(); });
  F.onSnapshot(F.doc(db, 'menu', 'main'), s => { M.settings = s.exists() ? s.data() : {}; got.s = true; fire(); });
  F.onSnapshot(F.doc(db, 'menu', 'status'), s => { M.status = s.exists() ? s.data() : {}; fire(); const u = Number(M.status.onlinePausedUntil || 0) - Date.now(); if (M.status.onlinePaused && u > 0 && u < 864e5) setTimeout(fire, u + 2000); }); // a timed pause ends by itself
}
async function api(action, body = {}){
  if (DEMO) return demoApi(action, body);
  const r = await fetch('/.netlify/functions/online', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({...body, action})});
  const d = await r.json().catch(() => ({error: 'Something went wrong. Please try again.'}));
  if (!r.ok) throw new Error(d.error || 'Something went wrong.'); return d;
}
function demoApi(action, b){
  if (action === 'gift'){ if (b.number === '6012345678901234') return {last4: '••1234', balance: 25}; if (b.number === '6000000000000005') return {last4: '••0005', balance: 5}; throw new Error("We couldn't find a gift card with that number."); }
  if (action === 'start'){ const lines = b.cart.map(d => BL(d)); const totals = R.cartTotals(lines, S(), b.tipPct); const sp = b.giftCard ? giftSplit(totals.charge, b.giftCard === '6012345678901234' ? 25 : 5) : {gift: 0, rest: totals.charge}; return {demo: true, giftOnly: !!b.giftCard && sp.rest === 0, paymentIntent: 'pi_demo', totals, due: sp.rest}; }
  if (action === 'finish') return {paid: true, num: 142, readyAt: pickup.type === 'asap' ? Date.now() + 15 * 60000 : null, pickup};
}

const mode = () => location.hash === '#asap' ? 'asap' : location.hash === '#later' ? 'later' : 'start';

function deadlineRule(){
  const dl = R.onlineSettings(S()).deadline;
  if (dl.weekly) return `Pre-orders for each week close ${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dl.weekday ?? 1]} at ${R.timeLabel(dl.time || '13:00')}.`;
  return `Pre-orders close ${Number(dl.daysBefore) === 1 ? 'the day before' : dl.daysBefore + ' days before'} pickup at ${R.timeLabel(dl.time || '17:00')}.`;

function openItem(id){
  const it = itemById(id); if (!it || !avail(it).ok) return;
  draft = {itemId: id, versionIdx: (it.versions || []).length > 1 ? null : 0, mods: []};
  for (const g of (it.modifierGroupIds || []).map(groupById).filter(Boolean)) if (g.default && g.options.some(o => o.name === g.default && R.optOn(o, chan()))) draft.mods.push({g: g.id, o: g.default, q: 1});
  for (const x of it.included || []) if (!draft.mods.some(m => m.g === x.g && m.o === x.o)) draft.mods.push({g: x.g, o: x.o, q: 1});
  if ((it.versions || []).length <= 1 && !(it.modifierGroupIds || []).length){ addDraft(); return; }
  renderItem();
}
const gCount = gid => draft.mods.filter(m => m.g === gid).reduce((s, m) => s + (m.q || 1), 0);
let lineErr = '';
function tryLine(){ try { lineErr = ''; return BL(structuredClone(draft), M.kds); } catch (e){ lineErr = e.message; return null; } }
function renderItem(){
  const it = itemById(draft.itemId); const vers = it.versions || []; const v = vers[draft.versionIdx ?? 0] || {};

  const ids = it.modifierGroupIds || []; draft.mods = draft.mods.filter(m => !ids.includes(m.g) || R.groupShown(it, m.g, draft.mods));

  for (const g of ids.map(id => R.ruleGroup(it, groupById(id), chan())).filter(Boolean)){
    if (!R.groupShown(it, g.id, draft.mods)) continue;
    const min = R.minFor(it, g), n = gCount(g.id); const counted = (it.countPricing && it.countPricing.group === g.id) || g.qtyEach; const rule = R.groupRuleText(it, g);
    const opts = g.options.filter(o => R.optOn(o, chan()));
    const head = `<h4>${esc(g.name)} ${min ? `<span class="tag ${n < min ? 'need' : ''}">Required</span>` : '<span class="tag">Optional</span>'}${counted ? ` <span class="tag">${n} picked${g._ruled && g.max && g.max < 99 ? ' of ' + g.max : ''}</span>` : ''}</h4>${rule ? `<div class="muted" style="margin:-4px 0 8px;font-size:14px">${esc(rule)}</div>` : ''}`;
    const body = counted ? opts.map(o => { const m = draft.mods.find(x => x.g === g.id && x.o === o.name); const q = m ? m.q : 0; return `<div class="step ${q ? 'on' : ''}"><span>${esc(o.name)}${g.qtyEach && R.optPrice(o, v.size, v.temp) ? ` <small class="muted">${money(R.optPrice(o, v.size, v.temp))} each</small>` : ''}</span><button data-minus="${esc(g.id)}|${esc(o.name)}" aria-label="One less ${esc(o.name)}" ${q ? '' : 'disabled'}>−</button><b>${q}</b><button data-plus="${esc(g.id)}|${esc(o.name)}" aria-label="One more ${esc(o.name)}" ${!q && g.maxKinds && draft.mods.filter(x => x.g === g.id).length >= g.maxKinds ? 'disabled' : ''}>+</button></div>`; }).join('')
      : opts.map(o => { const m = draft.mods.find(x => x.g === g.id && x.o === o.name); const p = R.optPrice(o, v.size, v.temp); const inc = (it.included || []).some(x => x.g === g.id && x.o === o.name); return `<button class="${m ? 'on' : ''}" data-opt="${esc(g.id)}|${esc(o.name)}">${esc(inc && !m ? 'No ' + o.name : o.name)}${inc ? (m ? ' <small>Included</small>' : '') : p ? ` <small>${p > 0 ? '+' : '−'}${money(Math.abs(p))}</small>` : ''}</button>`; }).join('');

}

function giftSplit(charge, bal){ let g = Math.round(Math.min(bal, charge) * 100) / 100; const rest = Math.round((charge - g) * 100) / 100; if (rest > 0 && rest < 0.5) g = Math.max(0, Math.round((charge - 0.5) * 100) / 100); return {gift: g, rest: Math.round((charge - g) * 100) / 100}; }

  if (v.length < 8){ $('#gErr').textContent = 'Please type the whole number on the card.'; return; }
  b.disabled = true; b.textContent = '…';
  try { const r = await api('gift', {number: v}); if (!(r.balance > 0)){ $('#gErr').textContent = `Gift card ${r.last4} has no balance left.`; b.disabled = false; b.textContent = 'Use'; return; } gift = {number: v, last4: r.last4, balance: r.balance}; giftOpen = false; current = null; renderCart(); }
  catch (e){ $('#gErr').textContent = e.message; b.disabled = false; b.textContent = 'Use'; }
}
let stripeJs = null, elements = null, current = null;
async function checkout(){
  me = {name: $('#fName').value.trim(), email: $('#fEmail').value.trim(), phone: $('#fPhone').value.trim()}; save('fs.me', me);
  if (!me.name) return renderCart('Please add a name for the order.', 'fName');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(me.email)) return renderCart(me.email ? 'That email doesn\'t look complete.' : 'Please add an email for your receipt.', 'fEmail');
  if ($('#fAllergyNote')) allergy.note = $('#fAllergyNote').value.trim();
  if (pickup.type === 'date' && !pickup.time) return renderCart('Please pick a pickup time.');
  if (pickup.type === 'date' && me.phone.replace(/\D/g, '').length < 10) return renderCart('Please add a phone number in case we need to reach you about your pre-order.', 'fPhone');
  if (allergy.separate && !allergy.note) return renderCart('Please tell us what to keep separate for allergies.', 'fAllergyNote');
  if (pickup.type === 'date' && !$('#fConfirm').checked) return renderCart('Please confirm your pickup day and time.', 'fConfirm');
  if (tipPct === null) return renderCart('Please pick a tip option (No tip is fine).', 'tipsRow');
  const btn = $('#checkout'); btn.disabled = true; btn.textContent = 'One moment…';
  try {
    current = await api('start', {giftCard: gift ? gift.number : null, cart: cart.map(({itemId, versionIdx, mods}) => ({itemId, versionIdx, mods})), pickup, tipPct, customer: {...me, allergySeparate: allergy.separate, allergyNote: allergy.note, smsOptIn: smsOk}});
    if (current.giftOnly){ $('#payBox').innerHTML = `<div class="note">Your gift card covers this order.</div>`; btn.textContent = 'Place order'; btn.disabled = false; btn.id = 'payNow'; return; }
    if (current.demo){ $('#payBox').innerHTML = `<div class="note warn">Demo: no card is charged.</div>`; btn.textContent = 'Pay ' + money(current.due ?? current.totals.charge); btn.disabled = false; btn.id = 'payNow'; return; }
    if (!current.publishableKey) throw new Error('Online payments are not set up yet.');
    if (!window.Stripe) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://js.stripe.com/v3/'; s.onload = res; s.onerror = () => rej(new Error('Could not load the payment form.')); document.head.appendChild(s); });
    stripeJs = stripeJs || window.Stripe(current.publishableKey);
    elements = stripeJs.elements({clientSecret: current.clientSecret, appearance: {theme: 'stripe', variables: {colorPrimary: '#1F5C55', borderRadius: '12px'}}});
    $('#payBox').innerHTML = '<div id="payEl"></div>'; elements.create('payment').mount('#payEl');
    btn.textContent = 'Pay ' + money(current.due ?? current.totals.charge); btn.disabled = false; btn.id = 'payNow';
  } catch (e){ if (/gift card/i.test(e.message)) gift = null; renderCart(e.message); }
}
async function payNow(){
  const btn = $('#payNow'); btn.disabled = true; btn.textContent = 'Paying…'; $('#cErr').textContent = '';
  try {
    if (!current.demo && !current.giftOnly){
      const r = await stripeJs.confirmPayment({elements, redirect: 'if_required', confirmParams: {return_url: location.href.split('?')[0] + '?paid=' + current.paymentIntent}});
      if (r.error){ $('#cErr').textContent = r.error.message; btn.disabled = false; btn.textContent = 'Pay ' + money(current.due ?? current.totals.charge); return; }
    }
    await finishOrder(current.paymentIntent);
  } catch (e){ if (/gift card only has/.test(e.message)){ gift = null; current = null; renderCart(e.message); return; } $('#cErr').textContent = e.message; btn.disabled = false; btn.textContent = 'Try again'; }
}
async function finishOrder(pi){
  let r; for (let i = 0; i < 6; i++){ r = await api('finish', {paymentIntent: pi}); if (r.paid) break; await new Promise(x => setTimeout(x, 1500)); }
  if (!r || !r.paid) throw new Error("Your payment is still processing. We'll start your order as soon as it goes through.");
  cart = []; gift = null; save(cartKey(), cart); $('#sheetRoot').innerHTML = ''; $('#bar').classList.add('hidden');
  const when = r.pickup && r.pickup.type === 'date' ? `Pick up ${longDay(r.pickup.date)}${r.pickup.time ? ' at ' + R.timeLabel(r.pickup.time) : ''}` : r.readyAt ? `Ready about ${new Date(r.readyAt).toLocaleTimeString('en-US', {timeZone: R.TZ, hour: 'numeric', minute: '2-digit'})}` : 'We’re on it';
  $('#app').innerHTML = `<div class="done"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#1F5C55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>
    <h1>Thank you${me.name ? ', ' + esc(me.name.split(' ')[0]) : ''}!</h1><div class="num">Order #${esc(r.num)}</div><p style="font-size:20px;margin:0">${esc(when)}</p><p class="muted" style="margin:0">Your receipt is on its way to ${esc(me.email)}. Give your name at the counter.</p>
    <button class="primary" id="again" style="margin-top:10px">Start another order</button></div>`;
}

// ---------- Events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button') || e.target;
  if (t.dataset.close && (e.target === t || e.target.closest('button'))){ draft = null; $('#sheetRoot').innerHTML = ''; return; }
  if (t.dataset.day){ later = {date: t.dataset.day, time: later.date === t.dataset.day ? later.time : ''}; save('fs.later', later); renderDayPick(top_()); return; }
  if (t.dataset.change){ e.preventDefault(); later = {...later, time: ''}; save('fs.later', later); render(); return; }
  if (t.dataset.cat){ cat = t.dataset.cat; render(); return; }
  if (t.dataset.item){ openItem(t.dataset.item); return; }
  if (t.id === 'addBtn'){ addDraft(); return; }
  if (t.dataset.ver !== undefined){ draft.versionIdx = Number(t.dataset.ver); renderItem(); return; }
  if (t.dataset.opt){ const [gid, name] = t.dataset.opt.split('|'); const g = R.ruleGroup(itemById(draft.itemId), groupById(gid), chan()); const cur = draft.mods.find(m => m.g === gid && m.o === name);
    if (cur) draft.mods = draft.mods.filter(m => m !== cur); else { if (g.max === 1) draft.mods = draft.mods.filter(m => m.g !== gid); if (gCount(gid) < (g.max || 99)) draft.mods.push({g: gid, o: name, q: 1}); }
    renderItem(); return; }
  if (t.dataset.plus){ const [gid, name] = t.dataset.plus.split('|'); const g = R.ruleGroup(itemById(draft.itemId), groupById(gid), chan()); const cur = draft.mods.find(m => m.g === gid && m.o === name); if (g.max && g.max < 99 && gCount(gid) >= g.max) return; if (cur) cur.q++; else draft.mods.push({g: gid, o: name, q: 1}); renderItem(); return; }
  if (t.dataset.minus){ const [gid, name] = t.dataset.minus.split('|'); const cur = draft.mods.find(m => m.g === gid && m.o === name); if (cur){ cur.q--; if (cur.q <= 0) draft.mods = draft.mods.filter(m => m !== cur); } renderItem(); return; }
  if (t.id === 'cartBtn'){ tipPct = null; confirmed = false; renderCart(); return; }
  if (t.id === 'fConfirm'){ confirmed = t.checked; return; }
  if (t.id === 'fSms'){ smsOk = t.checked; return; }
  if (t.id === 'fAllergy'){ allergy.separate = t.checked; $('#allergyBox').classList.toggle('hidden', !t.checked); return; }
  if (t.dataset.minus1 !== undefined){ cart.splice(Number(t.dataset.minus1), 1); save(cartKey(), cart); renderBar(); if (cart.length) renderCart(); else $('#sheetRoot').innerHTML = ''; return; }
  if (t.dataset.plus1 !== undefined){ cart.push(structuredClone(cart[Number(t.dataset.plus1)])); save(cartKey(), cart); renderBar(); renderCart(); return; }
  if (t.dataset.rmall !== undefined){ const drop = new Set(t.dataset.rmall.split(',').map(Number)); cart = cart.filter((x, i) => !drop.has(i)); save(cartKey(), cart); renderBar(); if (cart.length) renderCart(); else $('#sheetRoot').innerHTML = ''; return; }
  if (t.dataset.rm !== undefined){ cart.splice(Number(t.dataset.rm), 1); save(cartKey(), cart); renderBar(); if (cart.length) renderCart(); else $('#sheetRoot').innerHTML = ''; return; }
  if (t.dataset.tip !== undefined){ confirmed = $('#fConfirm') ? $('#fConfirm').checked : confirmed; tipPct = Number(t.dataset.tip); const err = $('#cErr') ? $('#cErr').textContent : ''; renderCart(err.includes('tip') ? '' : err); return; }
  if (t.id === 'giftOpen'){ giftOpen = true; renderCart(); setTimeout(() => $('#fGift') && $('#fGift').focus(), 50); return; }
  if (t.id === 'giftApply'){ applyGift(); return; }
  if (t.id === 'giftRm'){ gift = null; current = null; renderCart(); return; }
  if (t.id === 'checkout'){ checkout(); return; }
  if (t.id === 'payNow'){ payNow(); return; }
  if (t.id === 'again'){ location.hash = ''; render(); return; }
});
document.addEventListener('input', e => { if (e.target.id === 'fAllergyNote') allergy.note = e.target.value; });
document.addEventListener('click', e => { const b = e.target.closest('[data-time]'); if (!b) return; later = {...later, time: b.dataset.time}; save('fs.later', later); window.scrollTo(0, 0); render(); });
window.addEventListener('hashchange', () => { draft = null; $('#sheetRoot').innerHTML = ''; cat = null; tipPct = null; window.scrollTo(0, 0); render(); });
// Back from a bank redirect (some payment methods leave the page): finish the order.
const paid = new URLSearchParams(location.search).get('paid');
start().then(() => { if (paid) finishOrder(paid).catch(e => { $('#app').insertAdjacentHTML('afterbegin', `<div class="note warn">${esc(e.message)}</div>`); }); });
</script>
