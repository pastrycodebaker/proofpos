[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The Firebase web config key is public by design (Firestore rules protect the data), so the secret scan skips it.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyAoAZWaLAYw0rKmgpzvYj8TMAN37YSH2UY"

# Menu photos: /img/<id> is served by the images function.
[[redirects]]
  from = "/img/*"
  to = "/.netlify/functions/images/:splat"
  status = 200

# order.flourandsalt.com opens the customer order page (the staff screens stay at proofpos.netlify.app).
[[redirects]]
  from = "https://order.flourandsalt.com/"
  to = "/order/"
  status = 301
  force = true
